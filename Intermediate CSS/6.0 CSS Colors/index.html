<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Colors</title>
  <style>
    /* 1. Make the background of the webpage "antiquewhite"*/
    body {
      background-color: antiquewhite;
    }
    /* 2. Make the h1 "whitesmoke" & background of the h1 "darkseagreen" */
    h1 {
      color: whitesmoke;
      background: darkseagreen;
    }

    /* 4. Make the h2 #FAF8F1 & background of the h2 "#C58940" */
    h2 {
      color: #FAF8F1;
      background-color: #C58940;
    }

  </style>
</head>

<body>
  <h1>Hello</h1>
  <h2>World</h2>
</body>

</html>
